<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050914">
  <title>MEIZHOU AI</title>
  <link rel="stylesheet" href="voice-preview.css">
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <canvas id="space" aria-hidden="true"></canvas>
  <main class="shell">
    <header>
      <div class="brand"><span class="brand-mark">✳</span><span>MEIZHOU · AI</span></div>
      <div class="top-right">
      <div class="controls">
        <div class="control-wrap"><button class="icon-button" id="mic-button" type="button" aria-label="开启麦克风"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3.5M9 21.5h6"/></svg></button><span id="mic-caption">开始会话</span></div>
        <div class="control-wrap"><button class="icon-button" id="end-button" tabindex="-1"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6 5.6 18.4"/></svg></button><span>结束会话</span></div>
      </div>
      </div>
    </header>
    <section class="stage" aria-label="语音交互视觉核心">
      <div class="halo" aria-hidden="true"></div>
      <div class="orb-wrap" aria-hidden="true">
        <div class="core"><canvas id="core-canvas"></canvas><div class="lens"></div></div>
        <i class="node n1"></i><i class="node n2"></i><i class="node n3"></i>
        <div class="orbit-label"><b>NEURAL CORE</b><span id="core-frequency">FREQUENCY · 44.1 KHZ</span></div>
        <div class="orbit-label left"><b>LISTENING FIELD</b><span id="field-status">VOICE SIGNAL STABLE</span></div>
        <div class="orbit-label"><b>VOICE INPUT</b><span>AMPLITUDE · <span id="input-level">LOW</span></span></div>
        <div class="orbit-label"><b>RESPONSE STREAM</b><span>LATENCY · 32 MS</span></div>
        <div class="orbit-label"><b>NEURAL LINK</b><span>CHANNEL · SECURE</span></div>
        <div class="orbit-label"><b>ACOUSTIC FIELD</b><span>PHASE · SYNCHRONIZED</span></div>
      </div>
    </section>
    <section class="bottom" aria-label="AI 回复">
      <div class="eyebrow" id="voice-status">✦ 待机中</div>
      <div class="reply"><span id="reply-text">夜色已经降临，所有的设备都准备好了。<br>你想先从什么开始？</span><span id="ai-text"></span><span class="cursor" aria-hidden="true"></span></div>
    </section>
  </main>
  <script src="voice-preview.js"></script>
</body>
</html>
