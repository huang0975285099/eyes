<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>老叶视觉助手</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
      background: #07110f;
      color: #effbf7;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 10% 10%, rgba(38, 183, 142, .15), transparent 30rem),
        radial-gradient(circle at 90% 85%, rgba(61, 132, 245, .13), transparent 28rem),
        #07110f;
    }
    main {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 36px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 18px;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .orb {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #baffea, #28c99c 38%, #0b6653 72%);
      box-shadow: 0 0 32px rgba(40, 201, 156, .45);
    }
    h1 { margin: 0; font-size: clamp(20px, 3vw, 30px); letter-spacing: -.02em; }
    .subtitle { margin: 3px 0 0; color: #92aaa3; font-size: 13px; }
    .live-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border: 1px solid #28423c;
      border-radius: 999px;
      background: rgba(10, 27, 23, .8);
      color: #afc4be;
      font-size: 13px;
      white-space: nowrap;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #66756f; }
    .live-pill.ready .dot { background: #42e3b5; box-shadow: 0 0 14px #42e3b5; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 310px; gap: 18px; }
    .camera-card, .side-card {
      border: 1px solid rgba(111, 150, 140, .2);
      border-radius: 20px;
      background: rgba(9, 23, 20, .78);
      box-shadow: 0 18px 60px rgba(0, 0, 0, .3);
      overflow: hidden;
    }
    .video-wrap { position: relative; aspect-ratio: 16 / 9; background: #020504; }
    video { display: block; width: 100%; height: 100%; object-fit: cover; }
    .empty {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: #80938d;
      text-align: center;
      padding: 24px;
    }
    .camera-card.connected .empty { display: none; }
    .controls {
      display: flex;
      gap: 10px;
      padding: 13px;
      border-top: 1px solid rgba(111, 150, 140, .15);
    }
    select, button {
      min-height: 42px;
      border-radius: 11px;
      border: 1px solid #29463e;
      font: inherit;
    }
    select { flex: 1; min-width: 0; padding: 0 12px; background: #0b1b17; color: #d7e7e2; }
    button {
      padding: 0 16px;
      background: #2bc99c;
      color: #03241b;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { background: #4cdbb3; }
    .side-card { padding: 20px; display: flex; flex-direction: column; gap: 24px; }
    .label { color: #779089; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
    .assistant-state { margin: 8px 0 0; font-size: 21px; line-height: 1.35; }
    .answer {
      margin: 8px 0 0;
      color: #c7d8d3;
      line-height: 1.65;
      min-height: 78px;
      overflow-wrap: anywhere;
    }
    .model-row { display: flex; gap: 8px; margin-top: 9px; }
    .model-row button { white-space: nowrap; }
    .model-message { margin: 7px 0 0; min-height: 20px; color: #8fa69f; font-size: 12px; }
    .model-message.error { color: #e6aaa3; }
    .presence-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .presence-switch { display: inline-flex; align-items: center; gap: 8px; color: #9eb4ad; font-size: 12px; cursor: pointer; }
    .presence-switch input { position: absolute; opacity: 0; pointer-events: none; }
    .presence-track {
      position: relative;
      width: 38px;
      height: 22px;
      border-radius: 999px;
      background: #31443f;
      transition: background .18s ease;
    }
    .presence-track::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #d7e4e0;
      transition: transform .18s ease;
    }
    .presence-switch input:checked + .presence-track { background: #2bc99c; }
    .presence-switch input:checked + .presence-track::after { transform: translateX(16px); background: #05271e; }
    .presence-switch input:focus-visible + .presence-track { outline: 2px solid #a4ffe5; outline-offset: 2px; }
    .presence-switch input:disabled + .presence-track { opacity: .55; cursor: wait; }
    .presence-state { margin: 8px 0 3px; color: #bcd1ca; line-height: 1.45; }
    .presence-state.alert { color: #ffd08a; }
    .presence-detail { color: #78928a; font-size: 12px; }
    .presence-image[hidden] { display: none; }
    .snapshot-panel[hidden] { display: none; }
    .snapshot-image {
      display: block;
      width: 100%;
      margin-top: 9px;
      border: 1px solid rgba(111, 150, 140, .25);
      border-radius: 12px;
      background: #020504;
      aspect-ratio: 16 / 9;
      object-fit: cover;
    }
    .hint {
      margin-top: auto;
      padding: 15px;
      border-radius: 14px;
      background: rgba(42, 201, 156, .08);
      border: 1px solid rgba(42, 201, 156, .18);
      color: #a9beb8;
      line-height: 1.65;
      font-size: 14px;
    }
    .hint strong { display: block; color: #e7f8f2; margin-bottom: 4px; }
    .shutdown-button {
      width: 100%;
      margin-top: 10px;
      background: transparent;
      color: #e6aaa3;
      border-color: rgba(230, 115, 103, .35);
    }
    .shutdown-button:hover { background: rgba(230, 115, 103, .1); }
    @media (max-width: 820px) {
      .layout { grid-template-columns: 1fr; }
      .side-card { min-height: 270px; }
    }
    @media (max-width: 560px) {
      main { width: min(100% - 20px, 1180px); padding-top: 18px; }
      header { align-items: flex-start; }
      .subtitle { display: none; }
      .controls { flex-direction: column; }
      button { width: 100%; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="brand">
        <div class="orb" aria-hidden="true"></div>
        <div>
          <h1>老叶视觉助手</h1>
          <p class="subtitle">模型可随时切换</p>
        </div>
      </div>
      <div id="livePill" class="live-pill"><span class="dot"></span><span id="cameraState">正在连接</span></div>
    </header>

    <section class="layout">
      <div id="cameraCard" class="camera-card">
        <div class="video-wrap">
          <video id="video" autoplay muted playsinline></video>
          <div id="empty" class="empty">请允许浏览器访问摄像头<br>仅在视觉提问时提交同步快照</div>
        </div>
        <div class="controls">
          <select id="cameraSelect" aria-label="选择摄像头"><option>正在查找摄像头…</option></select>
          <button id="connectButton" type="button">连接摄像头</button>
        </div>
      </div>

      <aside class="side-card">
        <div>
          <div class="label">助手状态</div>
          <p id="assistantState" class="assistant-state">等待程序启动</p>
        </div>
        <div>
          <div class="label">最近回答</div>
          <p id="lastAnswer" class="answer">唤醒后问我：“你看到了什么？”</p>
        </div>
        <div>
          <div class="label">当前模型</div>
          <div class="model-row">
            <select id="modelSelect" aria-label="选择回答模型"></select>
            <button id="switchModelButton" type="button">切换</button>
          </div>
          <p id="modelMessage" class="model-message"></p>
        </div>
        <div id="presencePanel">
          <div class="presence-heading">
            <div class="label">动态人物监测</div>
            <label class="presence-switch">
              <input id="presenceToggle" type="checkbox" role="switch" aria-label="开启动态人物监测">
              <span class="presence-track" aria-hidden="true"></span>
              <span id="presenceToggleText">已关闭</span>
            </label>
          </div>
          <p id="presenceState" class="presence-state">正在初始化</p>
          <small id="presenceDetail" class="presence-detail">本地检测画面变化，模型确认是否有人</small>
          <img id="presenceImage" class="snapshot-image presence-image" hidden alt="检测到有人时的画面快照">
        </div>
        <div id="sceneBroadcastPanel">
          <div class="presence-heading">
            <div class="label">动态画面播报</div>
            <label class="presence-switch">
              <input id="sceneBroadcastToggle" type="checkbox" role="switch" aria-label="开启动态画面播报">
              <span class="presence-track" aria-hidden="true"></span>
              <span id="sceneBroadcastToggleText">已关闭</span>
            </label>
          </div>
          <p id="sceneBroadcastState" class="presence-state">动态画面播报已关闭</p>
          <small id="sceneBroadcastDetail" class="presence-detail">开启后，画面变化时会抓拍、描述并播报</small>
          <img id="sceneBroadcastImage" class="snapshot-image presence-image" hidden alt="动态播报所分析的画面快照">
        </div>
        <div id="snapshotPanel" class="snapshot-panel" hidden>
          <div class="label">本次分析快照</div>
          <img id="snapshotImage" class="snapshot-image" alt="本次视觉回答所分析的摄像头快照">
        </div>
        <div class="hint">
          <strong>使用方法</strong>
          首次说“老叶老叶”即可连续交流；支持天气查询，播报时说“停一下”可打断，空闲30秒后需再次唤醒。
          <button id="shutdownButton" class="shutdown-button" type="button">关闭老叶助手</button>
        </div>
      </aside>
    </section>
  </main>

  <script>
    const video = document.querySelector('#video');
    const cameraSelect = document.querySelector('#cameraSelect');
    const connectButton = document.querySelector('#connectButton');
    const cameraCard = document.querySelector('#cameraCard');
    const livePill = document.querySelector('#livePill');
    const cameraState = document.querySelector('#cameraState');
    const assistantState = document.querySelector('#assistantState');
    const lastAnswer = document.querySelector('#lastAnswer');
    const modelSelect = document.querySelector('#modelSelect');
    const switchModelButton = document.querySelector('#switchModelButton');
    const modelMessage = document.querySelector('#modelMessage');
    const presenceToggle = document.querySelector('#presenceToggle');
    const presenceToggleText = document.querySelector('#presenceToggleText');
    const presenceState = document.querySelector('#presenceState');
    const presenceDetail = document.querySelector('#presenceDetail');
    const presenceImage = document.querySelector('#presenceImage');
    const sceneBroadcastToggle = document.querySelector('#sceneBroadcastToggle');
    const sceneBroadcastToggleText = document.querySelector('#sceneBroadcastToggleText');
    const sceneBroadcastState = document.querySelector('#sceneBroadcastState');
    const sceneBroadcastDetail = document.querySelector('#sceneBroadcastDetail');
    const sceneBroadcastImage = document.querySelector('#sceneBroadcastImage');
    const snapshotPanel = document.querySelector('#snapshotPanel');
    const snapshotImage = document.querySelector('#snapshotImage');
    const shutdownButton = document.querySelector('#shutdownButton');
    let stream = null;
    let sendingFrame = false;
    let snapshotRequestInFlight = 0;
    let lastSnapshotRequestId = 0;
    let displayedSnapshotId = 0;
    let displayedPresenceEventId = 0;
    let displayedSceneBroadcastEventId = 0;
    let presenceRequestInFlight = false;
    let sceneBroadcastRequestInFlight = false;
    let presenceRetryTimer = 0;
    let presenceBackground = null;
    let presenceStartedAt = 0;
    let presenceChangedFrames = 0;
    let lastPresenceMotionAt = 0;
    let presenceSettings = {
      enabled: true,
      sensitivity: 70,
      min_area_percent: 0.8,
      consecutive_frames: 3,
      cooldown_seconds: 5,
    };
    let sceneBroadcastSettings = {
      enabled: false,
      cooldown_seconds: 12,
    };
    const presenceCanvas = document.createElement('canvas');
    presenceCanvas.width = 160;
    presenceCanvas.height = 90;
    const presenceContext = presenceCanvas.getContext('2d', { willReadFrequently: true });
    let preferredKeywords = ['Deli', '1080P', 'MM101S'];

    function setCameraStatus(text, ready) {
      cameraState.textContent = text;
      livePill.classList.toggle('ready', ready);
      cameraCard.classList.toggle('connected', ready);
    }

    function resetPresenceDetection() {
      presenceBackground = null;
      presenceStartedAt = performance.now();
      presenceChangedFrames = 0;
      lastPresenceMotionAt = 0;
      presenceRequestInFlight = false;
      sceneBroadcastRequestInFlight = false;
      if (presenceRetryTimer) clearTimeout(presenceRetryTimer);
      presenceRetryTimer = 0;
      if (presenceSettings.enabled) {
        presenceState.textContent = '正在建立画面基线';
      } else {
        presenceState.textContent = '动态人物监测已关闭';
      }
      if (sceneBroadcastSettings.enabled) {
        sceneBroadcastState.textContent = '正在建立画面基线';
      } else {
        sceneBroadcastState.textContent = '动态画面播报已关闭';
      }
    }

    function syncPresenceToggle(enabled) {
      presenceSettings.enabled = Boolean(enabled);
      presenceToggle.checked = presenceSettings.enabled;
      presenceToggleText.textContent = presenceSettings.enabled ? '已开启' : '已关闭';
    }

    function syncSceneBroadcastToggle(enabled) {
      sceneBroadcastSettings.enabled = Boolean(enabled);
      sceneBroadcastToggle.checked = sceneBroadcastSettings.enabled;
      sceneBroadcastToggleText.textContent = sceneBroadcastSettings.enabled ? '已开启' : '已关闭';
    }

    async function enumerateCameras() {
      const devices = await navigator.mediaDevices.enumerateDevices();
      const cameras = devices.filter((device) => device.kind === 'videoinput');
      cameraSelect.replaceChildren();
      cameras.forEach((camera, index) => {
        const option = document.createElement('option');
        option.value = camera.deviceId;
        option.textContent = camera.label || `摄像头 ${index + 1}`;
        cameraSelect.append(option);
      });
      const preferred = cameras.find((camera) =>
        preferredKeywords.some((keyword) => camera.label.toLowerCase().includes(keyword.toLowerCase()))
      );
      if (preferred) cameraSelect.value = preferred.deviceId;
      return cameras;
    }

    async function connectCamera(deviceId = '') {
      if (stream) stream.getTracks().forEach((track) => track.stop());
      setCameraStatus('正在连接', false);
      const videoConstraints = deviceId
        ? { deviceId: { exact: deviceId }, width: { ideal: 1280 }, height: { ideal: 720 } }
        : { width: { ideal: 1280 }, height: { ideal: 720 } };
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: videoConstraints, audio: false });
        video.srcObject = stream;
        await video.play();
        resetPresenceDetection();
        const cameras = await enumerateCameras();
        const activeId = stream.getVideoTracks()[0]?.getSettings().deviceId;
        if (!deviceId) {
          const preferred = cameras.find((camera) =>
            preferredKeywords.some((keyword) => camera.label.toLowerCase().includes(keyword.toLowerCase()))
          );
          if (preferred && preferred.deviceId !== activeId) {
            cameraSelect.value = preferred.deviceId;
            return connectCamera(preferred.deviceId);
          }
        }
        if (activeId) cameraSelect.value = activeId;
        setCameraStatus('画面已连接', true);
      } catch (error) {
        console.error(error);
        setCameraStatus('需要摄像头权限', false);
        document.querySelector('#empty').textContent = '无法打开摄像头，请允许权限后点击“连接摄像头”';
      }
    }

    async function captureCurrentFrame() {
      if (!stream || video.readyState < HTMLMediaElement.HAVE_CURRENT_DATA) return null;
      const canvas = document.createElement('canvas');
      const maxWidth = 1280;
      const scale = Math.min(1, maxWidth / video.videoWidth);
      canvas.width = Math.max(1, Math.round(video.videoWidth * scale));
      canvas.height = Math.max(1, Math.round(video.videoHeight * scale));
      canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
      return new Promise((resolve) => canvas.toBlob(resolve, 'image/jpeg', 0.82));
    }

    async function sendCurrentFrame() {
      if (sendingFrame) return;
      sendingFrame = true;
      try {
        const blob = await captureCurrentFrame();
        if (blob) await fetch('/api/frame', { method: 'POST', body: blob });
      } catch (error) {
        console.error(error);
      } finally {
        sendingFrame = false;
      }
    }

    async function sendPresenceCheck(reason) {
      if (!presenceSettings.enabled || presenceRequestInFlight) return;
      presenceRequestInFlight = true;
      try {
        const blob = await captureCurrentFrame();
        if (!blob) return;
        const response = await fetch('/api/presence-check', {
          method: 'POST',
          headers: { 'X-Presence-Reason': reason },
          body: blob,
        });
        if (response.status === 429 && reason === 'motion' && !presenceRetryTimer) {
          presenceRetryTimer = setTimeout(() => {
            presenceRetryTimer = 0;
            void sendPresenceCheck('motion');
          }, 1200);
        }
      } catch (error) {
        console.error(error);
      } finally {
        presenceRequestInFlight = false;
      }
    }

    async function sendSceneDescription() {
      if (!sceneBroadcastSettings.enabled || sceneBroadcastRequestInFlight) return;
      sceneBroadcastRequestInFlight = true;
      try {
        const blob = await captureCurrentFrame();
        if (!blob) return;
        await fetch('/api/scene-description', { method: 'POST', body: blob });
      } catch (error) {
        console.error(error);
      } finally {
        sceneBroadcastRequestInFlight = false;
      }
    }

    function monitorPresenceMotion() {
      const motionMonitoringEnabled = presenceSettings.enabled || sceneBroadcastSettings.enabled;
      if (!motionMonitoringEnabled || !stream || video.readyState < HTMLMediaElement.HAVE_CURRENT_DATA) return;
      presenceContext.drawImage(video, 0, 0, presenceCanvas.width, presenceCanvas.height);
      const pixels = presenceContext.getImageData(0, 0, presenceCanvas.width, presenceCanvas.height).data;
      const gray = new Uint8Array(presenceCanvas.width * presenceCanvas.height);
      for (let pixel = 0, index = 0; pixel < pixels.length; pixel += 4, index += 1) {
        gray[index] = Math.round(pixels[pixel] * .299 + pixels[pixel + 1] * .587 + pixels[pixel + 2] * .114);
      }

      const now = performance.now();
      if (!presenceBackground) {
        presenceBackground = Float32Array.from(gray);
        presenceStartedAt = now;
        if (presenceSettings.enabled) void sendPresenceCheck('baseline');
        if (sceneBroadcastSettings.enabled) void sendSceneDescription();
        return;
      }

      const threshold = Math.round(42 - (presenceSettings.sensitivity - 1) * 30 / 99);
      let changedPixels = 0;
      for (let index = 0; index < gray.length; index += 1) {
        if (Math.abs(gray[index] - presenceBackground[index]) >= threshold) changedPixels += 1;
      }
      const changedPercent = changedPixels / gray.length * 100;
      const significant = changedPercent >= presenceSettings.min_area_percent;
      presenceChangedFrames = significant ? presenceChangedFrames + 1 : 0;

      const learningRate = significant ? .002 : .025;
      for (let index = 0; index < gray.length; index += 1) {
        presenceBackground[index] += (gray[index] - presenceBackground[index]) * learningRate;
      }

      const warmedUp = now - presenceStartedAt >= 1200;
      const motionCooldownSeconds = presenceSettings.enabled
        ? presenceSettings.cooldown_seconds
        : sceneBroadcastSettings.cooldown_seconds;
      const cooledDown = now - lastPresenceMotionAt >= motionCooldownSeconds * 1000;
      if (warmedUp && cooledDown && presenceChangedFrames >= presenceSettings.consecutive_frames) {
        presenceChangedFrames = 0;
        lastPresenceMotionAt = now;
        // Treat the changed scene as the next baseline. This is essential for
        // detecting both "person left" and a later "person returned" transition.
        presenceBackground = Float32Array.from(gray);
        presenceStartedAt = now;
        if (presenceSettings.enabled) void sendPresenceCheck('motion');
        if (sceneBroadcastSettings.enabled) void sendSceneDescription();
      }
    }

    async function sendAnalysisSnapshot(requestId) {
      if (snapshotRequestInFlight) return;
      snapshotRequestInFlight = requestId;
      try {
        const blob = await captureCurrentFrame();
        if (!blob) return;
        const response = await fetch('/api/snapshot', {
          method: 'POST',
          headers: { 'X-Snapshot-Request-Id': String(requestId) },
          body: blob,
        });
        if (response.ok) lastSnapshotRequestId = requestId;
      } catch (error) {
        console.error(error);
      } finally {
        snapshotRequestInFlight = 0;
      }
    }

    async function refreshStatus() {
      try {
        const response = await fetch('/api/status', { cache: 'no-store' });
        const status = await response.json();
        assistantState.textContent = status.assistant_status;
        if (status.last_answer) lastAnswer.textContent = status.last_answer;
        syncPresenceToggle(status.presence_enabled);
        syncSceneBroadcastToggle(status.scene_broadcast_enabled);
        presenceState.textContent = status.presence_status || '等待动态监测';
        presenceState.classList.toggle(
          'alert',
          Number(status.presence_event_id || 0) > 0 && Boolean(status.person_present)
        );
        if (status.presence_error) {
          presenceDetail.textContent = status.presence_error;
        } else if (status.presence_event_time) {
          presenceDetail.textContent = `最近事件：${status.presence_event_time}`;
        }
        const presenceEventId = Number(status.presence_event_id || 0);
        if (presenceEventId > displayedPresenceEventId) {
          displayedPresenceEventId = presenceEventId;
          presenceImage.src = `/api/presence-snapshot?id=${presenceEventId}`;
          presenceImage.hidden = false;
        }
        sceneBroadcastState.textContent = status.scene_broadcast_status || '等待动态播报';
        if (status.scene_broadcast_error) {
          sceneBroadcastDetail.textContent = status.scene_broadcast_error;
        } else if (status.scene_broadcast_event_time) {
          sceneBroadcastDetail.textContent = `最近播报：${status.scene_broadcast_event_time}`;
        }
        const sceneEventId = Number(status.scene_broadcast_event_id || 0);
        if (sceneEventId > displayedSceneBroadcastEventId) {
          displayedSceneBroadcastEventId = sceneEventId;
          sceneBroadcastImage.src = `/api/scene-snapshot?id=${sceneEventId}`;
          sceneBroadcastImage.hidden = false;
        }
        const requestedSnapshotId = Number(status.snapshot_request_id || 0);
        if (
          status.snapshot_pending &&
          requestedSnapshotId > lastSnapshotRequestId &&
          !snapshotRequestInFlight
        ) {
          void sendAnalysisSnapshot(requestedSnapshotId);
        }
        const analysisSnapshotId = Number(status.analysis_snapshot_id || 0);
        if (analysisSnapshotId > displayedSnapshotId) {
          displayedSnapshotId = analysisSnapshotId;
          snapshotImage.src = `/api/snapshot?id=${analysisSnapshotId}`;
          snapshotPanel.hidden = false;
        }
        if (stream && !status.camera_ready) cameraState.textContent = '正在同步画面';
        if (stream && status.camera_ready) {
          cameraState.textContent = '画面已连接';
          livePill.classList.add('ready');
        }
      } catch (error) {
        assistantState.textContent = '语音程序未连接';
      }
    }

    connectButton.addEventListener('click', () => connectCamera(cameraSelect.value));
    cameraSelect.addEventListener('change', () => connectCamera(cameraSelect.value));
    presenceToggle.addEventListener('change', async () => {
      const enabled = presenceToggle.checked;
      presenceToggle.disabled = true;
      presenceToggleText.textContent = enabled ? '开启中' : '关闭中';
      try {
        const response = await fetch('/api/person-monitor', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ enabled }),
        });
        const result = await response.json();
        if (!response.ok || !result.ok) throw new Error(result.error || '设置失败');
        syncPresenceToggle(result.enabled);
        resetPresenceDetection();
        presenceDetail.textContent = result.enabled
          ? '本地画面变化筛选 · YOLO GPU人物确认'
          : '开启后，有人进入画面时会语音提示';
      } catch (error) {
        syncPresenceToggle(!enabled);
        presenceDetail.textContent = error.message || '设置失败，请稍后重试';
      } finally {
        presenceToggle.disabled = false;
      }
    });
    sceneBroadcastToggle.addEventListener('change', async () => {
      const enabled = sceneBroadcastToggle.checked;
      sceneBroadcastToggle.disabled = true;
      sceneBroadcastToggleText.textContent = enabled ? '开启中' : '关闭中';
      try {
        const response = await fetch('/api/scene-broadcast', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ enabled }),
        });
        const result = await response.json();
        if (!response.ok || !result.ok) throw new Error(result.error || '设置失败');
        syncSceneBroadcastToggle(result.enabled);
        resetPresenceDetection();
        sceneBroadcastDetail.textContent = result.enabled
          ? '画面变化时会抓拍，并由当前视觉模型简短播报'
          : '开启后，画面变化时会抓拍、描述并播报';
      } catch (error) {
        syncSceneBroadcastToggle(!enabled);
        sceneBroadcastDetail.textContent = error.message || '设置失败，请稍后重试';
      } finally {
        sceneBroadcastToggle.disabled = false;
      }
    });
    switchModelButton.addEventListener('click', async () => {
      switchModelButton.disabled = true;
      modelSelect.disabled = true;
      modelMessage.classList.remove('error');
      modelMessage.textContent = '正在检查并切换模型…';
      try {
        const response = await fetch('/api/model-provider', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ provider: modelSelect.value }),
        });
        const result = await response.json();
        if (!response.ok || !result.ok) throw new Error(result.error || '切换失败');
        modelSelect.value = result.model.provider;
        modelMessage.textContent = `已切换：${result.model.label}`;
      } catch (error) {
        modelMessage.classList.add('error');
        modelMessage.textContent = error.message || '切换失败';
      } finally {
        switchModelButton.disabled = false;
        modelSelect.disabled = false;
      }
    });
    shutdownButton.addEventListener('click', async () => {
      if (!confirm('确定要关闭老叶语音助手吗？')) return;
      shutdownButton.disabled = true;
      assistantState.textContent = '正在安全关闭';
      try {
        await fetch('/api/shutdown', { method: 'POST' });
        if (stream) {
          stream.getTracks().forEach((track) => track.stop());
          stream = null;
        }
        setCameraStatus('服务已关闭', false);
        assistantState.textContent = '老叶语音助手已关闭';
      } catch (_) {
        assistantState.textContent = '关闭请求已发送';
      }
    });

    (async () => {
      try {
        const response = await fetch('/api/config');
        const config = await response.json();
        preferredKeywords = config.camera_name_keywords || preferredKeywords;
        presenceSettings = { ...presenceSettings, ...(config.person_monitor || {}) };
        sceneBroadcastSettings = { ...sceneBroadcastSettings, ...(config.scene_broadcast || {}) };
        syncPresenceToggle(presenceSettings.enabled);
        syncSceneBroadcastToggle(sceneBroadcastSettings.enabled);
        if (!presenceSettings.enabled) {
          presenceState.textContent = '动态人物监测已关闭';
          presenceDetail.textContent = '开启后，有人进入画面时会语音提示';
        } else if (presenceSettings.detector === 'yolo') {
          presenceDetail.textContent = '本地画面变化筛选 · YOLO GPU人物确认';
        }
        if (sceneBroadcastSettings.enabled) {
          sceneBroadcastState.textContent = '等待画面变化';
          sceneBroadcastDetail.textContent = '画面变化时会抓拍，并由当前视觉模型简短播报';
        }
        modelSelect.replaceChildren();
        (config.model_options || []).forEach((item) => {
          const option = document.createElement('option');
          option.value = item.provider;
          option.textContent = item.label;
          modelSelect.append(option);
        });
        if (config.model) {
          modelSelect.value = config.model.provider;
          modelMessage.textContent = `正在使用：${config.model.label}`;
        }
      } catch (_) {}
      if (!navigator.mediaDevices?.getUserMedia) {
        setCameraStatus('浏览器不支持摄像头', false);
        return;
      }
      await connectCamera();
      setInterval(sendCurrentFrame, 1000);
      setInterval(monitorPresenceMotion, 500);
      setInterval(refreshStatus, 1000);
      refreshStatus();
    })();
  </script>
</body>
</html>
