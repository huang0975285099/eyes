<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小布视觉助手</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
      background: #07110f;
      color: #effbf7;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 10% 10%, rgba(38, 183, 142, .15), transparent 30rem),
        radial-gradient(circle at 90% 85%, rgba(61, 132, 245, .13), transparent 28rem),
        #07110f;
    }
    main {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 36px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 18px;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .orb {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #baffea, #28c99c 38%, #0b6653 72%);
      box-shadow: 0 0 32px rgba(40, 201, 156, .45);
    }
    h1 { margin: 0; font-size: clamp(20px, 3vw, 30px); letter-spacing: -.02em; }
    .subtitle { margin: 3px 0 0; color: #92aaa3; font-size: 13px; }
    .live-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border: 1px solid #28423c;
      border-radius: 999px;
      background: rgba(10, 27, 23, .8);
      color: #afc4be;
      font-size: 13px;
      white-space: nowrap;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #66756f; }
    .live-pill.ready .dot { background: #42e3b5; box-shadow: 0 0 14px #42e3b5; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 310px; gap: 18px; }
    .camera-card, .side-card {
      border: 1px solid rgba(111, 150, 140, .2);
      border-radius: 20px;
      background: rgba(9, 23, 20, .78);
      box-shadow: 0 18px 60px rgba(0, 0, 0, .3);
      overflow: hidden;
    }
    .video-wrap { position: relative; aspect-ratio: 16 / 9; background: #020504; }
    video { display: block; width: 100%; height: 100%; object-fit: cover; }
    .empty {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: #80938d;
      text-align: center;
      padding: 24px;
    }
    .camera-card.connected .empty { display: none; }
    .controls {
      display: flex;
      gap: 10px;
      padding: 13px;
      border-top: 1px solid rgba(111, 150, 140, .15);
    }
    select, button {
      min-height: 42px;
      border-radius: 11px;
      border: 1px solid #29463e;
      font: inherit;
    }
    select { flex: 1; min-width: 0; padding: 0 12px; background: #0b1b17; color: #d7e7e2; }
    button {
      padding: 0 16px;
      background: #2bc99c;
      color: #03241b;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { background: #4cdbb3; }
    .side-card { padding: 20px; display: flex; flex-direction: column; gap: 24px; }
    .label { color: #779089; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
    .assistant-state { margin: 8px 0 0; font-size: 21px; line-height: 1.35; }
    .answer {
      margin: 8px 0 0;
      color: #c7d8d3;
      line-height: 1.65;
      min-height: 78px;
      overflow-wrap: anywhere;
    }
    .hint {
      margin-top: auto;
      padding: 15px;
      border-radius: 14px;
      background: rgba(42, 201, 156, .08);
      border: 1px solid rgba(42, 201, 156, .18);
      color: #a9beb8;
      line-height: 1.65;
      font-size: 14px;
    }
    .hint strong { display: block; color: #e7f8f2; margin-bottom: 4px; }
    .shutdown-button {
      width: 100%;
      margin-top: 10px;
      background: transparent;
      color: #e6aaa3;
      border-color: rgba(230, 115, 103, .35);
    }
    .shutdown-button:hover { background: rgba(230, 115, 103, .1); }
    canvas { display: none; }
    @media (max-width: 820px) {
      .layout { grid-template-columns: 1fr; }
      .side-card { min-height: 270px; }
    }
    @media (max-width: 560px) {
      main { width: min(100% - 20px, 1180px); padding-top: 18px; }
      header { align-items: flex-start; }
      .subtitle { display: none; }
      .controls { flex-direction: column; }
      button { width: 100%; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="brand">
        <div class="orb" aria-hidden="true"></div>
        <div>
          <h1>小布视觉助手</h1>
          <p class="subtitle">摄像头画面仅在本机处理</p>
        </div>
      </div>
      <div id="livePill" class="live-pill"><span class="dot"></span><span id="cameraState">正在连接</span></div>
    </header>

    <section class="layout">
      <div id="cameraCard" class="camera-card">
        <div class="video-wrap">
          <video id="video" autoplay muted playsinline></video>
          <div id="empty" class="empty">请允许浏览器访问摄像头<br>画面不会离开这台电脑</div>
        </div>
        <div class="controls">
          <select id="cameraSelect" aria-label="选择摄像头"><option>正在查找摄像头…</option></select>
          <button id="connectButton" type="button">连接摄像头</button>
        </div>
      </div>

      <aside class="side-card">
        <div>
          <div class="label">助手状态</div>
          <p id="assistantState" class="assistant-state">等待程序启动</p>
        </div>
        <div>
          <div class="label">最近回答</div>
          <p id="lastAnswer" class="answer">唤醒后问我：“你看到了什么？”</p>
        </div>
        <div class="hint">
          <strong>使用方法</strong>
          先说“小布小布”，听到“我在”后，再问“你看到了什么”。
          <button id="shutdownButton" class="shutdown-button" type="button">关闭小布助手</button>
        </div>
      </aside>
    </section>
    <canvas id="captureCanvas"></canvas>
  </main>

  <script>
    const video = document.querySelector('#video');
    const canvas = document.querySelector('#captureCanvas');
    const cameraSelect = document.querySelector('#cameraSelect');
    const connectButton = document.querySelector('#connectButton');
    const cameraCard = document.querySelector('#cameraCard');
    const livePill = document.querySelector('#livePill');
    const cameraState = document.querySelector('#cameraState');
    const assistantState = document.querySelector('#assistantState');
    const lastAnswer = document.querySelector('#lastAnswer');
    const shutdownButton = document.querySelector('#shutdownButton');
    let stream = null;
    let sendingFrame = false;
    let preferredKeywords = ['Deli', '1080P', 'MM101S'];

    function setCameraStatus(text, ready) {
      cameraState.textContent = text;
      livePill.classList.toggle('ready', ready);
      cameraCard.classList.toggle('connected', ready);
    }

    async function enumerateCameras() {
      const devices = await navigator.mediaDevices.enumerateDevices();
      const cameras = devices.filter((device) => device.kind === 'videoinput');
      cameraSelect.replaceChildren();
      cameras.forEach((camera, index) => {
        const option = document.createElement('option');
        option.value = camera.deviceId;
        option.textContent = camera.label || `摄像头 ${index + 1}`;
        cameraSelect.append(option);
      });
      const preferred = cameras.find((camera) =>
        preferredKeywords.some((keyword) => camera.label.toLowerCase().includes(keyword.toLowerCase()))
      );
      if (preferred) cameraSelect.value = preferred.deviceId;
      return cameras;
    }

    async function connectCamera(deviceId = '') {
      if (stream) stream.getTracks().forEach((track) => track.stop());
      setCameraStatus('正在连接', false);
      const videoConstraints = deviceId
        ? { deviceId: { exact: deviceId }, width: { ideal: 1280 }, height: { ideal: 720 } }
        : { width: { ideal: 1280 }, height: { ideal: 720 } };
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: videoConstraints, audio: false });
        video.srcObject = stream;
        await video.play();
        const cameras = await enumerateCameras();
        const activeId = stream.getVideoTracks()[0]?.getSettings().deviceId;
        if (!deviceId) {
          const preferred = cameras.find((camera) =>
            preferredKeywords.some((keyword) => camera.label.toLowerCase().includes(keyword.toLowerCase()))
          );
          if (preferred && preferred.deviceId !== activeId) {
            cameraSelect.value = preferred.deviceId;
            return connectCamera(preferred.deviceId);
          }
        }
        if (activeId) cameraSelect.value = activeId;
        setCameraStatus('画面已连接', true);
      } catch (error) {
        console.error(error);
        setCameraStatus('需要摄像头权限', false);
        document.querySelector('#empty').textContent = '无法打开摄像头，请允许权限后点击“连接摄像头”';
      }
    }

    async function sendCurrentFrame() {
      if (!stream || video.readyState < HTMLMediaElement.HAVE_CURRENT_DATA || sendingFrame) return;
      sendingFrame = true;
      try {
        const maxWidth = 1280;
        const scale = Math.min(1, maxWidth / video.videoWidth);
        canvas.width = Math.max(1, Math.round(video.videoWidth * scale));
        canvas.height = Math.max(1, Math.round(video.videoHeight * scale));
        canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
        const blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/jpeg', 0.82));
        if (blob) await fetch('/api/frame', { method: 'POST', body: blob });
      } catch (error) {
        console.error(error);
      } finally {
        sendingFrame = false;
      }
    }

    async function refreshStatus() {
      try {
        const response = await fetch('/api/status', { cache: 'no-store' });
        const status = await response.json();
        assistantState.textContent = status.assistant_status;
        if (status.last_answer) lastAnswer.textContent = status.last_answer;
        if (stream && !status.camera_ready) cameraState.textContent = '正在同步画面';
        if (stream && status.camera_ready) {
          cameraState.textContent = '画面已连接';
          livePill.classList.add('ready');
        }
      } catch (error) {
        assistantState.textContent = '语音程序未连接';
      }
    }

    connectButton.addEventListener('click', () => connectCamera(cameraSelect.value));
    cameraSelect.addEventListener('change', () => connectCamera(cameraSelect.value));
    shutdownButton.addEventListener('click', async () => {
      if (!confirm('确定要关闭小布语音助手吗？')) return;
      shutdownButton.disabled = true;
      assistantState.textContent = '正在安全关闭';
      try {
        await fetch('/api/shutdown', { method: 'POST' });
        if (stream) {
          stream.getTracks().forEach((track) => track.stop());
          stream = null;
        }
        setCameraStatus('服务已关闭', false);
        assistantState.textContent = '小布语音助手已关闭';
      } catch (_) {
        assistantState.textContent = '关闭请求已发送';
      }
    });

    (async () => {
      try {
        const response = await fetch('/api/config');
        const config = await response.json();
        preferredKeywords = config.camera_name_keywords || preferredKeywords;
      } catch (_) {}
      if (!navigator.mediaDevices?.getUserMedia) {
        setCameraStatus('浏览器不支持摄像头', false);
        return;
      }
      await connectCamera();
      setInterval(sendCurrentFrame, 1000);
      setInterval(refreshStatus, 1000);
      refreshStatus();
    })();
  </script>
</body>
</html>
