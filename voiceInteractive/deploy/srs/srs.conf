# SRS 6 配置模板 —— USB 摄像头 WebRTC 推流接入
# 本文件是模板：__CANDIDATE__ 由 deploy.sh 渲染为 srs.runtime.conf 后才挂载进容器。
# candidate 必须是「浏览器 / PP-Human 可达的宿主机 IP」（如 10.0.20.219），
# 不能留空、不能填容器地址，否则浏览器拿到不可达的 ICE 候选地址，推不上流。

listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
    crossdomain     on;   # 允许浏览器跨域拉 FLV/HLS（页面在 127.0.0.1:8765）
}

http_api {
    enabled         on;
    listen          1985;
    crossdomain     on;   # 允许浏览器跨域 POST WHIP/WHEP 信令（CORS 预检必需，无鉴权）
}

stats {
    network         0;
}

# WebRTC（WHIP 推流 / WHEP 拉流）
rtc_server {
    enabled         on;
    listen          8000;          # UDP
    candidate       __CANDIDATE__;
}

vhost __defaultVhost__ {
    # HLS 输出：http://<IP>:8080/live/<流名>.m3u8
    hls {
        enabled         on;
        hls_fragment    2;
        hls_window      10;
        hls_path        ./objs/nginx/html;
        hls_m3u8_file   [app]/[stream].m3u8;
        hls_ts_file     [app]/[stream]-[seq].ts;
        hls_cleanup     on;
        hls_dispose     30;
    }

    # HTTP-FLV：http://<IP>:8080/live/<流名>.flv（PP-Human 备选拉流方式）
    http_remux {
        enabled         on;
        mount           [vhost]/[app]/[stream].flv;
        hstrs           on;
    }

    # WebRTC 与 RTMP 双向自动桥接
    rtc {
        enabled         on;
        rtmp_to_rtc     on;   # RTMP -> WebRTC（浏览器直接看 USB 流）
        rtc_to_rtmp     on;   # WebRTC -> RTMP（WHIP 推上来后 PP-Human 才能拉 rtmp://）
    }
}
