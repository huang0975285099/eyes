listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

http_api {
    enabled         on;
    listen          1985;
}

stats {
    network         0;
}

vhost __defaultVhost__ {
    http_hooks {
        enabled         on;
        # 推流鉴权和生命周期回调由同一 Docker 网络内的 RecordingService 处理。
        on_publish      http://recording-service:52350/api/srs/on-publish;
        on_unpublish    http://recording-service:52350/api/srs/on-unpublish;
        on_play         http://recording-service:52350/api/srs/on-play;
        on_stop         http://recording-service:52350/api/srs/on-stop;
    }

    # HLS 输出：http://<本节点>:8080/live/<stream>.m3u8
    # 监控墙 16 画面用 HLS（分片短连接，不占浏览器「6 个 HTTP/1.1 长连接」名额）。
    # HLS 分片配置。
    hls {
        enabled         on;
        hls_fragment    2;
        hls_window      10;
        hls_path        ./objs/nginx/html;
        hls_m3u8_file   [app]/[stream].m3u8;
        hls_ts_file     [app]/[stream]-[seq].ts;
        hls_cleanup     on;
        hls_dispose     30;
    }

    http_remux {
        enabled         on;
        mount           [vhost]/[app]/[stream].flv;
        hstrs           on;
    }

}
