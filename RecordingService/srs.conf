listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

http_api {
    enabled         on;
    listen          1985;
}

stats {
    network         0;
}

vhost __defaultVhost__ {
    http_hooks {
        enabled         on;
        # 推流事件回调 A 节点主服务，记录 StreamStatus（含 srs_host）
        on_publish      http://112.18.238.6:52351/api/srs/on-publish;
        on_unpublish    http://112.18.238.6:52351/api/srs/on-unpublish;
        on_play         http://112.18.238.6:52351/api/srs/on-play;
        on_stop         http://112.18.238.6:52351/api/srs/on-stop;
    }

    # HLS 输出：http://<本节点>:28080/live/<stream>.m3u8
    # 监控墙 16 画面用 HLS（分片短连接，不占浏览器「6 个 HTTP/1.1 长连接」名额）。
    # 需与主节点 ukeysystem/srs/conf/srs.conf 的 hls 配置保持一致。
    hls {
        enabled         on;
        hls_fragment    2;
        hls_window      10;
        hls_path        ./objs/nginx/html;
        hls_m3u8_file   [app]/[stream].m3u8;
        hls_ts_file     [app]/[stream]-[seq].ts;
        hls_cleanup     on;
        hls_dispose     30;
    }

    http_remux {
        enabled         on;
        mount           [vhost]/[app]/[stream].flv;
        hstrs           on;
    }

    # forward：将本节点所有推流转发到公网 SRS，供公网后台监控查看。
    # 公网 SRS 收到转发流后同样触发 on_publish（token 随原始推流 URL 一起转发），
    # 主服务据此更新 StreamStatus；公网后台通过 public_srs_host 拉 HLS。
    forward {
        enabled         on;
        destination     112.18.238.6:1935;
    }
}
