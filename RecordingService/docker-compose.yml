services:
  mysql:
    image: mysql:8.1.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "all_seeing_eyes"
      MYSQL_DATABASE: "eyes"
      TZ: "Asia/Shanghai"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - rec-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  srs:
    image: ossrs/srs:5
    restart: always
    ports:
      - "21935:1935"   # RTMP 推流
      - "28080:8080"   # HTTP-FLV 拉流（管理员看实时画面）
    volumes:
      - ./srs.conf:/usr/local/srs/conf/docker.conf:ro
    networks:
      - rec-net
    healthcheck:
      test: ["CMD", "bash", "-c", "echo >/dev/tcp/127.0.0.1/1985"]
      interval: 10s
      timeout: 3s
      retries: 10

  recording-service:
    build: .
    image: "${RECORDING_IMAGE:-recording-service:latest}"
    restart: always
    environment:
      DB_HOST: "mysql"
      DB_PORT: "3306"
      DB_USER: "root"
      DB_PASSWORD: "all_seeing_eyes"
      DB_NAME: "eyes"
      DB_CHARSET: "utf8mb4"
      CLIENT_API_KEY: "${CLIENT_API_KEY}"
      STREAM_TOKEN_SECRET: "${STREAM_TOKEN_SECRET:-}"
      RECORDING_SRS_API: "http://srs:1985"
      RECORDING_RTMP_HOST: "srs:1935"
      PUBLIC_RTMP_HOST: "${PUBLIC_RTMP_HOST:-112.18.238.6:21935}"
      RECORDING_OUTPUT_DIR: "/var/recordings"
      RECORDING_FFMPEG_PATH: "ffmpeg"
      RECORDING_SEGMENT_DURATION: "600"
      RECORDING_CHECK_INTERVAL: "30"
      RECORDING_RETAIN_DAYS: "2"
      RECORDING_FRAME_RETAIN_DAYS: "30"
      RECORDING_NODE_ZONE_ID: "0"
      RECORDING_NODE_ID: "${RECORDING_NODE_ID:-recording-node-1}"
      RECORDING_NODE_NAME: "${RECORDING_NODE_NAME:-录像节点}"
      RECORDING_CENTER_URL: "${RECORDING_CENTER_URL:-}"
      RECORDING_CENTER_KEY: "${RECORDING_CENTER_KEY:-}"
      RECORDING_WEB_PORT: "8089"
      RECORDING_SRS_HTTP_HOST: "${RECORDING_SRS_HTTP_HOST:-112.18.238.6:28080}"
    ports:
      - "52350:8089"
    networks:
      - rec-net
    volumes:
      - recordings:/var/recordings
    depends_on:
      mysql:
        condition: service_healthy
      srs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8089/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  mysql_data:
  recordings:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "${RECORDING_DIR:-/home/test/recordings}"

networks:
  rec-net:
    driver: bridge
