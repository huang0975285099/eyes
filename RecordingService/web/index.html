<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>内网监控管理后台</title>
  <script src="/hls.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif; background: #f0f2f5; color: #333; }

    /* 顶部导航 */
    header {
      background: #1a1a2e; color: white;
      padding: 10px 20px; display: flex; align-items: center; gap: 20px;
      position: sticky; top: 0; z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    header h1 { font-size: 16px; font-weight: 600; white-space: nowrap; }
    .tabs { display: flex; gap: 4px; }
    .tab {
      padding: 6px 18px; border-radius: 6px 6px 0 0; cursor: pointer;
      font-size: 13px; color: #aaa; transition: all 0.2s;
    }
    .tab:hover { color: #fff; background: rgba(255,255,255,0.1); }
    .tab.active { color: #fff; background: #4a9eff; }
    .header-info { margin-left: auto; display: flex; gap: 16px; font-size: 12px; color: #ccc; }
    .header-info span { white-space: nowrap; }

    /* 通用 */
    .content { padding: 16px; }
    .empty { text-align: center; color: #999; padding: 60px 20px; font-size: 14px; }
    .loading { text-align: center; color: #999; padding: 40px; }
    .card { background: white; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); padding: 16px; margin-bottom: 16px; }
    .card-title { font-size: 14px; font-weight: 600; margin-bottom: 12px; color: #333; }

    /* 表格 */
    table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.1); font-size: 13px; }
    thead th { background: #f7f8fa; padding: 10px 12px; text-align: left; color: #666; font-weight: 500; border-bottom: 1px solid #eee; white-space: nowrap; }
    tbody td { padding: 9px 12px; border-bottom: 1px solid #f5f5f5; vertical-align: middle; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: #f8f9ff; }

    /* 状态标签 */
    .badge { display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: 11px; font-weight: 500; }
    .badge-online { background: #d4edda; color: #155724; }
    .badge-offline { background: #f8d7da; color: #721c24; }
    .badge-on { background: #d4edda; color: #155724; }
    .badge-off { background: #fff3cd; color: #856404; }

    /* 按钮 */
    .btn { padding: 5px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; }
    .btn-primary { background: #4a9eff; color: white; }
    .btn-primary:hover { background: #2d7dd2; }
    .btn-success { background: #28a745; color: white; }
    .btn-danger { background: #dc3545; color: white; }
    .btn-sm { padding: 3px 10px; font-size: 11px; }

    /* 筛选栏 */
    .filters { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .filters select, .filters input { padding: 5px 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px; height: 32px; background: white; }

    /* 统计卡片 */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .stat-card { background: white; border-radius: 8px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
    .stat-label { font-size: 12px; color: #999; margin-bottom: 4px; }
    .stat-value { font-size: 22px; font-weight: 600; color: #333; }
    .stat-sub { font-size: 11px; color: #aaa; margin-top: 2px; }

    /* 开关 */
    .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: #ccc; transition: 0.3s; border-radius: 24px; }
    .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background: white; transition: 0.3s; border-radius: 50%; }
    input:checked + .slider { background: #28a745; }
    input:checked + .slider:before { transform: translateX(20px); }

    /* 实时监控网格 */
    .monitor-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; }
    .monitor-cell { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
    .monitor-cell video { width: 100%; height: 200px; background: #000; display: block; }
    .monitor-info { padding: 8px 12px; font-size: 12px; }
    .monitor-info .name { font-weight: 600; color: #333; }
    .monitor-info .mac { font-family: monospace; color: #999; }

    /* 抽帧网格 */
    .frame-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
    .frame-card { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
    .frame-card img { width: 100%; height: 160px; object-fit: cover; display: block; background: #eee; cursor: zoom-in; }
    .frame-info { padding: 9px 12px; font-size: 12px; line-height: 1.6; }

    /* 播放器 */
    #playerSection { display: none; background: #000; border-radius: 8px; overflow: hidden; margin-bottom: 16px; }
    #player { display: block; width: 100%; max-height: 55vh; background: #000; }
    #playerInfo { background: #1a1a2e; color: #ccc; padding: 6px 16px; font-size: 12px; display: flex; gap: 16px; flex-wrap: wrap; }

    .mac { font-family: monospace; font-size: 12px; color: #666; }
    .time { white-space: nowrap; }
    .page { display: none; }
    .page.active { display: block; }
  </style>
</head>
<body>

<header>
  <h1>📹 内网监控管理后台</h1>
  <div class="tabs">
    <div class="tab active" onclick="switchTab('monitor')">实时监控</div>
    <div class="tab" onclick="switchTab('streams')">推流状态</div>
    <div class="tab" onclick="switchTab('recordings')">录像列表</div>
    <div class="tab" onclick="switchTab('frames')">抽帧</div>
    <div class="tab" onclick="switchTab('manage')">录制管理</div>
  </div>
  <div class="header-info" id="headerInfo"></div>
</header>

<!-- ========== 实时监控 ========== -->
<div id="page-monitor" class="page active">
  <div class="content">
    <div class="filters">
      <button class="btn btn-primary" onclick="loadStreamsForMonitor()">刷新</button>
      <span style="font-size:12px;color:#999">每30秒自动刷新</span>
    </div>
    <div id="monitorGrid" class="monitor-grid"></div>
    <div id="monitorEmpty" class="empty" style="display:none">暂无在线设备推流</div>
  </div>
</div>

<!-- ========== 推流状态 ========== -->
<div id="page-streams" class="page">
  <div class="content">
    <div class="filters">
      <button class="btn btn-primary" onclick="loadStreamStatus()">刷新</button>
      <span style="font-size:12px;color:#999">每30秒自动刷新</span>
    </div>
    <table id="streamTable" style="display:none">
      <thead>
        <tr><th>状态</th><th>设备名称</th><th>MAC 地址</th><th>IP 地址</th><th>用户</th><th>流名称</th></tr>
      </thead>
      <tbody id="streamTbody"></tbody>
    </table>
    <div id="streamEmpty" class="empty">暂无在线推流</div>
  </div>
</div>

<!-- ========== 录像列表 ========== -->
<div id="page-recordings" class="page">
  <div class="content">
    <div class="filters">
      <input type="date" id="dateInput">
      <select id="macSelect"><option value="">全部设备</option></select>
      <button class="btn btn-primary" onclick="loadSegments()">查询</button>
      <span style="font-size:12px;color:#999" id="countTag"></span>
    </div>
    <div id="playerSection">
      <video id="player" controls></video>
      <div id="playerInfo"></div>
    </div>
    <div id="segHint" class="empty">请选择日期后点击「查询」</div>
    <table id="segTable" style="display:none">
      <thead>
        <tr><th>开始时间</th><th>时长</th><th>大小</th><th>设备</th><th>用户</th><th>操作</th></tr>
      </thead>
      <tbody id="segTbody"></tbody>
    </table>
  </div>
</div>

<!-- ========== 抽帧 ========== -->
<div id="page-frames" class="page">
  <div class="content">
    <div class="filters">
      <input type="date" id="frameDateInput">
      <input type="text" id="frameMacInput" placeholder="MAC 地址（可选）">
      <button class="btn btn-primary" onclick="loadFrames()">查询</button>
      <span style="font-size:12px;color:#999" id="frameCountTag"></span>
    </div>
    <div id="frameGrid" class="frame-grid"></div>
    <div id="frameEmpty" class="empty">请选择日期后点击「查询」</div>
  </div>
</div>

<!-- ========== 录制管理 ========== -->
<div id="page-manage" class="page">
  <div class="content">
    <div class="stats-grid" id="statsGrid"></div>
    <div class="card">
      <div class="card-title">录制开关</div>
      <div style="display:flex;align-items:center;gap:12px">
        <label class="switch">
          <input type="checkbox" id="recordToggle" onchange="toggleRecord()">
          <span class="slider"></span>
        </label>
        <span id="recordLabel">加载中...</span>
      </div>
      <p style="font-size:12px;color:#999;margin-top:8px">关闭后推流和实时监控保持正常，服务端停止录制新录像。</p>
    </div>
    <div class="card">
      <div class="card-title">录像保留策略</div>
      <div style="display:flex;align-items:center;gap:12px">
        <span>录像保留</span>
        <input type="number" id="retainDays" min="1" max="365" style="width:60px;padding:4px;border:1px solid #ddd;border-radius:4px">
        <span>天，超期自动删除</span>
        <button class="btn btn-primary btn-sm" onclick="saveRetainDays()">保存</button>
      </div>
      <p id="retainDaysHint" style="font-size:12px;color:#999;margin-top:8px"></p>
    </div>
  </div>
</div>

<script>
  // ========== 全局状态 ==========
  let srsHttpHost = '';
  let monitorRefreshTimer = null;
  let streamRefreshTimer = null;
  const monitorPlayers = {}; // streamName -> Hls instance

  // ========== Tab 切换 ==========
  function switchTab(name) {
    document.querySelectorAll('.tab').forEach((t, i) => {
      t.classList.toggle('active', ['monitor','streams','recordings','frames','manage'][i] === name);
    });
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page-' + name).classList.add('active');

    // 停止非监控页的播放器
    if (name !== 'monitor') {
      Object.values(monitorPlayers).forEach(p => { try { p.destroy() } catch {} });
      Object.keys(monitorPlayers).forEach(k => delete monitorPlayers[k]);
    }

    if (name === 'monitor') loadStreamsForMonitor();
    if (name === 'streams') loadStreamStatus();
    if (name === 'recordings') { loadMACs(); loadSegments(); }
    if (name === 'frames') loadFrames();
    if (name === 'manage') { loadManageData(); loadRecordingSettings(); }
  }

  // ========== 实时监控 ==========
  async function loadStreamsForMonitor() {
    const grid = document.getElementById('monitorGrid');
    const empty = document.getElementById('monitorEmpty');

    let streams = [];
    try {
      const res = await fetch('/api/streams');
      if (res.ok) streams = await res.json();
    } catch {}

    if (!streams.length) {
      grid.innerHTML = '';
      empty.style.display = '';
      return;
    }
    if (!srsHttpHost) {
      grid.innerHTML = '';
      empty.textContent = 'SRS HTTP 地址未配置，无法播放实时画面';
      empty.style.display = '';
      return;
    }
    empty.style.display = 'none';

    // 销毁旧播放器
    Object.values(monitorPlayers).forEach(p => { try { p.destroy() } catch {} });
    Object.keys(monitorPlayers).forEach(k => delete monitorPlayers[k]);

    grid.innerHTML = streams.map(s => `
      <div class="monitor-cell">
        <video id="v-${s.stream_name}" muted autoplay playsinline></video>
        <div class="monitor-info">
          <div class="name">${s.hostname || s.user_name || s.mac || s.stream_name}</div>
          <div class="mac">${s.mac || ''} ${s.ip ? '· ' + s.ip : ''}</div>
        </div>
      </div>
    `).join('');

    // 为每个 video 启动 HLS 播放
    streams.forEach(s => {
      const video = document.getElementById('v-' + s.stream_name);
      if (!video) return;
      const hlsUrl = `http://${srsHttpHost}/live/${s.stream_name}.m3u8`;
      playHLS(video, hlsUrl, s.stream_name);
    });
  }

  function playHLS(video, url, key) {
    if (Hls.isSupported()) {
      const hls = new Hls({ liveDurationInfinity: true, lowLatencyMode: true });
      hls.loadSource(url);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
      hls.on(Hls.Events.ERROR, (e, data) => {
        if (data.fatal) {
          setTimeout(() => { try { hls.destroy() } catch {} }, 3000);
        }
      });
      monitorPlayers[key] = hls;
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = url;
      video.play().catch(() => {});
    }
  }

  // ========== 推流状态 ==========
  async function loadStreamStatus() {
    const table = document.getElementById('streamTable');
    const empty = document.getElementById('streamEmpty');
    const tbody = document.getElementById('streamTbody');

    let streams = [];
    try {
      const res = await fetch('/api/streams');
      if (res.ok) streams = await res.json();
    } catch {}

    if (!streams.length) {
      table.style.display = 'none';
      empty.style.display = '';
      return;
    }
    empty.style.display = 'none';
    table.style.display = '';

    tbody.innerHTML = streams.map(s => `
      <tr>
        <td><span class="badge badge-online">在线</span></td>
        <td>${s.hostname || '-'}</td>
        <td class="mac">${s.mac || '-'}</td>
        <td>${s.ip || '-'}</td>
        <td>${s.user_name || '-'}</td>
        <td class="mac">${s.stream_name}</td>
      </tr>
    `).join('');
  }

  // ========== 录像列表 ==========
  async function loadMACs() {
    try {
      const res = await fetch('/api/macs');
      if (!res.ok) return;
      const macs = await res.json();
      const sel = document.getElementById('macSelect');
      sel.innerHTML = '<option value="">全部设备</option>';
      (macs || []).forEach(m => {
        const opt = document.createElement('option');
        opt.value = m.mac;
        opt.textContent = m.user_name ? `${m.user_name}（${m.hostname || m.mac}）` : (m.hostname || m.mac);
        sel.appendChild(opt);
      });
    } catch {}
  }

  async function loadSegments() {
    const date = document.getElementById('dateInput').value;
    const mac = document.getElementById('macSelect').value;
    const params = new URLSearchParams();
    if (date) params.set('date', date);
    if (mac) params.set('mac', mac);

    const hint = document.getElementById('segHint');
    const table = document.getElementById('segTable');
    hint.textContent = '加载中...';
    hint.className = 'loading';
    hint.style.display = '';
    table.style.display = 'none';

    let segs = [];
    try {
      const res = await fetch('/api/segments?' + params);
      if (res.ok) segs = await res.json();
    } catch {
      hint.textContent = '加载失败';
      hint.className = 'empty';
      return;
    }

    document.getElementById('countTag').textContent = segs.length ? `共 ${segs.length} 条` : '';

    if (!segs.length) {
      hint.textContent = '该日期暂无录像记录';
      hint.className = 'empty';
      return;
    }
    hint.style.display = 'none';
    table.style.display = '';

    const tbody = document.getElementById('segTbody');
    tbody.innerHTML = segs.map(seg => `
      <tr>
        <td class="time">${new Date(seg.started_at).toLocaleString('zh-CN', {hour12:false})}</td>
        <td>${formatDuration(seg.duration)}</td>
        <td style="color:#999;font-size:12px">${formatSize(seg.file_size)}</td>
        <td><span>${seg.hostname || seg.mac}</span><br><span class="mac">${seg.mac}</span></td>
        <td>${seg.user_name || '-'}</td>
        <td><button class="btn btn-primary btn-sm" onclick="playSegment(${seg.id}, this)">播放</button></td>
      </tr>
    `).join('');
  }

  let currentTr = null;
  function playSegment(id, btn) {
    if (currentTr) {
      currentTr.classList.remove('active');
      const prevBtn = currentTr.querySelector('.btn');
      if (prevBtn) { prevBtn.textContent = '播放'; prevBtn.className = 'btn btn-primary btn-sm'; }
    }
    const tr = btn.closest('tr');
    tr.classList.add('active');
    currentTr = tr;
    btn.textContent = '播放中';
    btn.className = 'btn btn-success btn-sm';

    const player = document.getElementById('player');
    const section = document.getElementById('playerSection');
    player.src = `/segments/${id}/video`;
    player.load();
    player.play().catch(() => {});
    section.style.display = 'block';
    section.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // ========== 抽帧 ==========
  async function loadFrames() {
    const date = document.getElementById('frameDateInput').value;
    const mac = document.getElementById('frameMacInput').value.trim();
    const grid = document.getElementById('frameGrid');
    const empty = document.getElementById('frameEmpty');
    const count = document.getElementById('frameCountTag');
    if (!date) {
      grid.innerHTML = '';
      empty.style.display = '';
      return;
    }
    empty.textContent = '加载中...';
    empty.style.display = '';
    try {
      const params = new URLSearchParams({ date });
      if (mac) params.set('mac', mac.toLowerCase());
      const res = await fetch('/api/frames?' + params.toString());
      if (!res.ok) throw new Error(await res.text());
      const frames = await res.json();
      count.textContent = `共 ${frames.length} 张`;
      if (!frames.length) {
        grid.innerHTML = '';
        empty.textContent = '该日期暂无抽帧图片';
        return;
      }
      empty.style.display = 'none';
      grid.innerHTML = frames.map(frame => `
        <div class="frame-card">
          <a href="/frames/${frame.id}/image" target="_blank" title="点击查看原图">
            <img src="/frames/${frame.id}/image" loading="lazy" alt="${frame.stream_name || frame.mac || '抽帧'}">
          </a>
          <div class="frame-info">
            <div><b>${new Date(frame.captured_at).toLocaleString()}</b></div>
            <div class="mac">${frame.mac || frame.stream_name || '-'}</div>
            <div style="color:#999">第 ${frame.frame_index || '-'} 帧 · ${formatSize(frame.file_size)}</div>
          </div>
        </div>
      `).join('');
    } catch (e) {
      grid.innerHTML = '';
      count.textContent = '';
      empty.textContent = '加载失败：' + e.message;
    }
  }

  // ========== 录制管理 ==========
  async function loadManageData() {
    // 统计
    try {
      const res = await fetch('/api/stats');
      if (res.ok) {
        const stats = await res.json();
        srsHttpHost = stats.srs_http_host || '';
        document.getElementById('statsGrid').innerHTML = `
          <div class="stat-card"><div class="stat-label">在线推流</div><div class="stat-value">${stats.online_streams}</div></div>
          <div class="stat-card"><div class="stat-label">录像总数</div><div class="stat-value">${stats.seg_count}</div></div>
          <div class="stat-card"><div class="stat-label">录像占用</div><div class="stat-value">${formatSize(stats.total_size)}</div></div>
          <div class="stat-card"><div class="stat-label">磁盘使用</div><div class="stat-value">${stats.disk_percent.toFixed(1)}%</div><div class="stat-sub">${formatSize(stats.disk_used)} / ${formatSize(stats.disk_total)}</div></div>
          <div class="stat-card"><div class="stat-label">剩余空间</div><div class="stat-value" style="color:${stats.disk_free < 5*1024*1024*1024 ? '#dc3545' : '#28a745'}">${formatSize(stats.disk_free)}</div></div>
        `;
      }
    } catch {}

  }

  async function loadRecordingSettings() {
    try {
      const res = await fetch('/api/recording-settings');
      if (!res.ok) return;
      const cfg = await res.json();
      document.getElementById('retainDays').value = cfg.retain_days;
      const toggle = document.getElementById('recordToggle');
      toggle.checked = cfg.record_enabled;
      toggle.disabled = false;
      document.getElementById('recordLabel').textContent = cfg.record_enabled ? '已开启录制' : '已关闭录制';
      const hint = document.getElementById('retainDaysHint');
      if (cfg.using_db_config) {
        hint.textContent = `当前值由后台配置（环境变量默认值：${cfg.env_retain_days} 天）。修改后立即生效，无需重启。`;
      } else {
        hint.textContent = `当前值来自环境变量 RECORDING_RETAIN_DAYS（${cfg.env_retain_days} 天）。修改后保存到数据库，立即生效。`;
      }
    } catch {}
  }

  async function toggleRecord() {
    const toggle = document.getElementById('recordToggle');
    const enabled = toggle.checked;
    toggle.disabled = true;
    try {
      const res = await fetch('/api/recording-settings', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ record_enabled: enabled })
      });
      if (!res.ok) throw new Error(await res.text());
      document.getElementById('recordLabel').textContent = enabled ? '已开启录制' : '已关闭录制';
    } catch (e) {
      toggle.checked = !enabled;
      alert('切换录制状态失败：' + e.message);
    } finally {
      toggle.disabled = false;
    }
  }

  async function saveRetainDays() {
    const days = parseInt(document.getElementById('retainDays').value);
    if (!days || days <= 0) {
      alert('请输入有效的保留天数');
      return;
    }
    try {
      const res = await fetch('/api/recording-settings', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ retain_days: days })
      });
      if (res.ok) {
        loadRecordingSettings();
      } else {
        const text = await res.text();
        alert('保存失败: ' + text);
      }
    } catch (e) {
      alert('保存失败: ' + e.message);
    }
  }

  // ========== 工具函数 ==========
  function formatDuration(secs) {
    if (!secs || secs <= 0) return '-';
    const h = Math.floor(secs / 3600), m = Math.floor((secs % 3600) / 60), s = Math.floor(secs % 60);
    return h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
  }
  function formatSize(bytes) {
    if (!bytes || bytes <= 0) return '-';
    if (bytes < 1024*1024) return (bytes/1024).toFixed(0) + ' KB';
    if (bytes < 1024*1024*1024) return (bytes/1024/1024).toFixed(1) + ' MB';
    return (bytes/1024/1024/1024).toFixed(2) + ' GB';
  }
  function pad(n) { return String(n).padStart(2, '0'); }

  // ========== 初始化 ==========
  document.getElementById('dateInput').value = new Date().toLocaleDateString('sv');
  document.getElementById('frameDateInput').value = new Date().toLocaleDateString('sv');

  // 加载 SRS HTTP Host，完成后再加载监控画面
  fetch('/api/stats').then(r => r.json()).then(s => {
    srsHttpHost = s.srs_http_host || '';
  }).catch(() => {}).finally(() => {
    loadStreamsForMonitor();
  });

  // 自动刷新
  monitorRefreshTimer = setInterval(() => {
    if (document.getElementById('page-monitor').classList.contains('active')) loadStreamsForMonitor();
  }, 30000);
  streamRefreshTimer = setInterval(() => {
    if (document.getElementById('page-streams').classList.contains('active')) loadStreamStatus();
  }, 30000);
</script>
</body>
</html>
