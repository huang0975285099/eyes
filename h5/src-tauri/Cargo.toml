[package]
name = "eyes-customer"
version = "1.0.1"
description = "千里眼客户管理平台"
authors = ["All-Seeing Eyes"]
edition = "2021"

[lib]
name = "eyes_customer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
