name: eyes

services:
  mysql:
    image: mysql:8.1.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "all_seeing_eyes"
      MYSQL_DATABASE: "eyes"
      TZ: "Asia/Shanghai"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - rec-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  srs:
    image: ossrs/srs:6
    restart: always
    ports:
      - "1935:1935"   # RTMP 推流
      - "8080:8080"   # HTTP-FLV/HLS 拉流
    volumes:
      - ./srs.conf:/usr/local/srs/conf/docker.conf:ro
    networks:
      - rec-net
    healthcheck:
      test: ["CMD", "bash", "-c", "echo >/dev/tcp/127.0.0.1/1985"]
      interval: 10s
      timeout: 3s
      retries: 10

  media-service:
    build: .
    image: "${MEDIA_IMAGE:-media-service:latest}"
    restart: always
    environment:
      DB_HOST: "mysql"
      DB_PORT: "3306"
      DB_USER: "root"
      DB_PASSWORD: "all_seeing_eyes"
      DB_NAME: "eyes"
      DB_CHARSET: "utf8mb4"
      RECORDING_SRS_API: "http://srs:1985"
      RECORDING_RTMP_HOST: "srs:1935"
      AI_SRS_HTTP_BASE: "http://srs:8080"
      PUBLIC_RTMP_HOST: "${PUBLIC_RTMP_HOST:-112.18.238.6:1935}"
      RECORDING_OUTPUT_DIR: "/var/recordings"
      RECORDING_FFMPEG_PATH: "ffmpeg"
      RECORDING_SEGMENT_DURATION: "600"
      RECORDING_CHECK_INTERVAL: "30"
      RECORDING_RETAIN_DAYS: "2"
      RECORDING_FRAME_RETAIN_DAYS: "30"
      MEDIA_WEB_PORT: "22222"
      MEDIA_SRS_HTTP_HOST: "${MEDIA_SRS_HTTP_HOST:-112.18.238.6:8080}"
      UPDATE_ADMIN_KEY: "${UPDATE_ADMIN_KEY:-}"
      CLIENT_UPDATE_DIR: "/var/client-updates"
    ports:
      - "22222:22222"
    networks:
      - rec-net
    volumes:
      - recordings:/var/recordings
      - client_updates:/var/client-updates
    depends_on:
      mysql:
        condition: service_healthy
      srs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:22222/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  ai-service:
    build:
      context: ../AIService
    image: "${AI_IMAGE:-eyes-ai-service:latest}"
    restart: always
    environment:
      AI_MEDIA_API: "http://media-service:22222"
      AI_SRS_PUBLIC_BASE: "http://${MEDIA_SRS_HTTP_HOST:-112.18.238.6:8080}"
      AI_EVIDENCE_ROOT: "/var/recordings"
      AI_WORKER_ID: "${AI_WORKER_ID:-ai-worker-01}"
      AI_CONCURRENCY: "${AI_CONCURRENCY:-4}"
      AI_POLL_INTERVAL: "${AI_POLL_INTERVAL:-3}"
      AI_HEARTBEAT_INTERVAL: "${AI_HEARTBEAT_INTERVAL:-10}"
      AI_JOB_LEASE_SECONDS: "${AI_JOB_LEASE_SECONDS:-300}"
      AI_REQUEST_TIMEOUT: "${AI_REQUEST_TIMEOUT:-15}"
      AI_FFMPEG_TIMEOUT: "${AI_FFMPEG_TIMEOUT:-30}"
      AI_HEALTH_PORT: "11111"
      # 预留给后续Qwen视觉复核模块；当前frame_sampler不会调用模型API。
      DASHSCOPE_API_KEY: "${DASHSCOPE_API_KEY:-}"
      DASHSCOPE_BASE_URL: "${DASHSCOPE_BASE_URL:-}"
      QWEN_VL_MODEL: "${QWEN_VL_MODEL:-}"
    ports:
      - "11111:11111"
    networks:
      - rec-net
    volumes:
      - recordings:/var/recordings
    depends_on:
      media-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:11111/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  mysql_data:
    name: eyes_mysql_data
  recordings:
    name: eyes_recordings
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "${RECORDING_DIR:-/home/test/recordings}"
  client_updates:
    name: eyes_client_updates
    driver: local

networks:
  rec-net:
    driver: bridge
