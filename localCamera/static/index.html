<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101512" />
    <title>守望 · 摄像头变化预警</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true"><span></span></div>
          <div>
            <p class="eyebrow">LOCAL VISION GUARD</p>
            <h1>守望</h1>
          </div>
        </div>
        <div class="connection-pill" id="connectionPill">
          <span class="status-dot"></span>
          <span id="connectionText">正在连接</span>
        </div>
      </header>

      <section class="alert-banner" id="alertBanner" role="alert" aria-live="assertive">
        <div class="alert-icon">!</div>
        <div>
          <strong>检测到画面变化</strong>
          <span id="alertTime">刚刚</span>
        </div>
        <button id="dismissAlert" class="icon-button" aria-label="关闭警报">×</button>
      </section>

      <div class="workspace">
        <section class="viewer-card">
          <div class="viewer-toolbar">
            <div>
              <p class="section-kicker">LIVE FEED</p>
              <h2>实时画面</h2>
            </div>
            <div class="stream-meta">
              <span><b id="fpsValue">--</b> FPS</span>
              <span>变化 <b id="motionValue">0.00%</b></span>
            </div>
          </div>
          <div class="camera-frame" id="cameraFrame">
            <img id="cameraStream" src="/stream.mjpg" alt="USB 摄像头实时画面" />
            <div class="scan-line"></div>
            <div class="camera-placeholder" id="cameraPlaceholder">
              <div class="camera-glyph"></div>
              <strong>正在等待摄像头</strong>
              <span id="cameraError">请确认 USB 摄像头已连接</span>
            </div>
            <div class="monitor-badge" id="monitorBadge"><i></i> 监控中</div>
          </div>
          <div class="primary-controls">
            <button class="primary-button" id="monitorToggle">
              <span class="button-icon" aria-hidden="true"></span>
              <span id="monitorToggleText">开启变化监控</span>
            </button>
            <button class="secondary-button" id="soundToggle" aria-pressed="true">
              <span id="soundIcon">♪</span> 声音告警
            </button>
          </div>
          <p class="hint">开启后会先学习约 1 秒的当前画面，再开始检测变化。</p>
        </section>

        <aside class="side-panel">
          <section class="panel-card settings-card">
            <div class="panel-heading">
              <div>
                <p class="section-kicker">DETECTION</p>
                <h2>检测设置</h2>
              </div>
              <button class="text-button" id="saveSettings">保存</button>
            </div>

            <label class="field-label" for="cameraIndex">摄像头编号</label>
            <div class="stepper">
              <button type="button" id="cameraMinus" aria-label="减小摄像头编号">−</button>
              <input id="cameraIndex" type="number" min="0" max="9" value="0" />
              <button type="button" id="cameraPlus" aria-label="增大摄像头编号">＋</button>
            </div>

            <div class="range-heading">
              <label class="field-label" for="sensitivity">灵敏度</label>
              <output id="sensitivityValue">60</output>
            </div>
            <input class="range" id="sensitivity" type="range" min="1" max="100" value="60" />
            <div class="range-caption"><span>稳定</span><span>灵敏</span></div>

            <label class="field-label" for="minArea">最小变化区域</label>
            <div class="input-with-unit">
              <input id="minArea" type="number" min="0.05" max="50" step="0.05" value="0.8" />
              <span>% 画面</span>
            </div>

            <label class="field-label" for="consecutiveFrames">连续确认帧数</label>
            <div class="input-with-unit">
              <input id="consecutiveFrames" type="number" min="1" max="30" value="3" />
              <span>帧</span>
            </div>

            <label class="check-row">
              <input id="saveSnapshots" type="checkbox" checked />
              <span class="fake-check"></span>
              <span><b>保存预警截图</b><small>仅保存在这台电脑上</small></span>
            </label>
          </section>

          <section class="panel-card events-card">
            <div class="panel-heading">
              <div>
                <p class="section-kicker">ACTIVITY</p>
                <h2>最近预警</h2>
              </div>
              <span class="count-badge" id="eventCount">0</span>
            </div>
            <div class="event-list" id="eventList">
              <div class="empty-state">
                <span class="empty-rings"></span>
                <strong>暂时一切安静</strong>
                <small>检测到变化后会记录在这里</small>
              </div>
            </div>
          </section>
        </aside>
      </div>
    </main>
    <div class="toast" id="toast" role="status"></div>
    <script src="/app.js"></script>
  </body>
</html>
